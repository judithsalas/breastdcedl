name: CI

# Lint (ruff) en cada push y pull request. Los tests se quedan en local.
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff==0.16.8
      - name: Lint (ruff)
        run: ruff check .
